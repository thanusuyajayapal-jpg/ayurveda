<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign Up - AyurVeda Panchakarma Center</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="img/ayurveda (2).jpg">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Configuration for Dark Mode & Custom Ayurvedic Colors -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              light: '#d1e7df', 
              DEFAULT: '#059669', /* Ayurvedic Emerald */
              dark: '#047857', 
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-[#F4FBF7] text-[#062414] dark:bg-[#062414] dark:text-[#ECFDF5] transition-colors duration-300 font-sans min-h-screen min-h-[100dvh] w-full relative flex flex-col items-center justify-center p-4 py-6 sm:py-10 overflow-x-hidden overflow-y-auto">

  <!-- BACKGROUND EFFECTS -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
      <!-- Soft Brand Blobs -->
      <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-emerald-500/15 dark:bg-emerald-500/5 blur-[120px]"></div>
      <div class="absolute top-[60%] -right-[10%] w-[40%] h-[50%] rounded-full bg-amber-500/10 blur-[120px]"></div>
      
      <!-- Subtle Pattern -->
      <div class="absolute inset-0 opacity-20 dark:opacity-5" style="background-image: radial-gradient(circle at 2px 2px, #059669 1px, transparent 0); background-size: 32px 32px;"></div>
  </div>

  <!-- TOP NAVIGATION CONTROLS (Back to Home, Dark mode, RTL) -->
  <div class="w-full max-w-3xl flex items-center justify-between mb-3 sm:mb-4 px-1 z-20">
      <a href="index.html" class="h-10 inline-flex items-center gap-2 px-3.5 sm:px-4 rounded-full bg-white/90 dark:bg-emerald-950/90 backdrop-blur-md border border-emerald-200/80 dark:border-emerald-800/80 text-emerald-900 dark:text-emerald-200 hover:bg-brand hover:text-white dark:hover:bg-brand dark:hover:text-white hover:border-brand transition-all text-xs sm:text-sm font-semibold shadow-sm group">
          <i class="fa-solid fa-arrow-left transition-transform group-hover:-translate-x-0.5 rtl:group-hover:translate-x-0.5 rtl:rotate-180"></i>
          <span>Home</span>
      </a>
      <div class="flex items-center gap-2 sm:gap-2.5">
          <button id="darkToggleBtn" class="w-10 h-10 rounded-full bg-white/90 dark:bg-emerald-950/90 backdrop-blur-md border border-emerald-200/80 dark:border-emerald-800/80 flex items-center justify-center text-emerald-900 dark:text-emerald-200 hover:bg-brand hover:text-white dark:hover:bg-brand dark:hover:text-white transition-all shadow-sm text-sm" title="Toggle dark mode" aria-label="Toggle dark mode">
              🌙
          </button>
          <button id="rtlToggleBtn" class="h-10 min-w-[40px] px-3 sm:px-3.5 rounded-full bg-white/90 dark:bg-emerald-950/90 backdrop-blur-md border border-emerald-200/80 dark:border-emerald-800/80 flex items-center justify-center text-emerald-900 dark:text-emerald-200 font-bold text-xs hover:bg-brand hover:text-white dark:hover:bg-brand dark:hover:text-white transition-all shadow-sm" title="Toggle RTL/LTR" aria-label="Toggle text direction">
              LTR
          </button>
      </div>
  </div>

  <!-- CENTERED CARD (Reduced to max-w-3xl to match login card size) -->
  <div class="w-full max-w-3xl bg-white/80 dark:bg-[#0A2E1A]/80 backdrop-blur-2xl border border-white/40 dark:border-emerald-900/50 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.4)] flex flex-col md:flex-row overflow-hidden relative z-10">
      
      <!-- FORM SIDE -->
      <div class="w-full md:w-1/2 p-6 sm:p-8 flex flex-col justify-center">
          <div class="mb-6 text-center">
              <!-- AYURVEDA LOGO MATCHING INDEX.HTML -->
              <a href="index.html" class="inline-flex items-center justify-center gap-3 no-underline group mb-6 mx-auto">
                <div class="w-9 h-9 bg-brand rounded-xl flex items-center justify-center transition-transform group-hover:scale-105 shadow-md text-white">
                  <i class="fas fa-leaf text-lg"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-emerald-950 dark:text-white">
                  AYURVEDA</span>
                </span>
              </a>
              <h2 class="text-2xl font-extrabold text-emerald-950 dark:text-white mb-1.5 tracking-tight">Create Account</h2>
              <p class="text-emerald-800/80 dark:text-emerald-300/80 text-xs">Join our wellness sanctuary portal.</p>
          </div>

          <!-- GOOGLE SIGNUP -->
          <button type="button" class="w-full flex items-center justify-center gap-2 py-2 px-4 bg-white dark:bg-emerald-900/60 border border-emerald-200 dark:border-emerald-700 rounded-xl text-emerald-950 dark:text-emerald-100 text-xs font-bold hover:bg-emerald-50 dark:hover:bg-emerald-900 transition-all mb-2.5 shadow-sm hover:shadow">
              <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-3.5 h-3.5" alt="Google">
              Sign up with Google
          </button>

          <!-- APPLE SIGNUP -->
          <button type="button" class="w-full flex items-center justify-center gap-2 py-2 px-4 bg-white dark:bg-emerald-900/60 border border-emerald-200 dark:border-emerald-700 rounded-xl text-emerald-950 dark:text-emerald-100 text-xs font-bold hover:bg-emerald-50 dark:hover:bg-emerald-900 transition-all mb-4 shadow-sm hover:shadow">
              <i class="fab fa-apple text-base mb-[1px]"></i>
              Sign up with Apple
          </button>

          <div class="flex items-center gap-3 mb-4">
              <div class="flex-1 h-px bg-emerald-200 dark:bg-emerald-800"></div>
              <span class="text-[10px] font-bold text-emerald-700/70 dark:text-emerald-400/70 uppercase tracking-wider">Or email</span>
              <div class="flex-1 h-px bg-emerald-200 dark:bg-emerald-800"></div>
          </div>

          <form action="doctor-dashboard.html" method="GET" class="space-y-3.5">
              <div>
                  <label class="block text-[11px] font-bold text-emerald-900 dark:text-emerald-200 mb-1 uppercase tracking-wider">Full Name</label>
                  <div class="relative group">
                      <div class="absolute inset-y-0 start-0 ps-3 flex items-center pointer-events-none transition-colors group-focus-within:text-brand text-emerald-600/70 dark:text-emerald-400/70">
                          <i class="fas fa-user text-xs"></i>
                      </div>
                      <input type="text" class="w-full bg-[#F4FBF7] dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 rounded-xl ps-9 pe-3 py-2 transition-all text-xs font-medium text-emerald-950 dark:text-white placeholder-emerald-400/70 dark:placeholder-emerald-500/70 focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand" placeholder="Sarah Jenkins" required>
                  </div>
              </div>

              <div>
                  <label class="block text-[11px] font-bold text-emerald-900 dark:text-emerald-200 mb-1 uppercase tracking-wider">Email Address</label>
                  <div class="relative group">
                      <div class="absolute inset-y-0 start-0 ps-3 flex items-center pointer-events-none transition-colors group-focus-within:text-brand text-emerald-600/70 dark:text-emerald-400/70">
                          <i class="fas fa-envelope text-xs"></i>
                      </div>
                      <input type="email" class="w-full bg-[#F4FBF7] dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 rounded-xl ps-9 pe-3 py-2 transition-all text-xs font-medium text-emerald-950 dark:text-white placeholder-emerald-400/70 dark:placeholder-emerald-500/70 focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand" placeholder="sarah@example.com" required>
                  </div>
              </div>
              
              <div>
                  <label class="block text-[11px] font-bold text-emerald-900 dark:text-emerald-200 mb-1 uppercase tracking-wider">Password</label>
                  <div class="relative group">
                      <div class="absolute inset-y-0 start-0 ps-3 flex items-center pointer-events-none transition-colors group-focus-within:text-brand text-emerald-600/70 dark:text-emerald-400/70">
                          <i class="fas fa-lock text-xs"></i>
                      </div>
                      <input type="password" id="password-input" class="w-full bg-[#F4FBF7] dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 rounded-xl ps-9 pe-9 py-2 transition-all text-xs font-medium text-emerald-950 dark:text-white placeholder-emerald-400/70 dark:placeholder-emerald-500/70 focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand" placeholder="••••••••" required>
                      <button type="button" id="toggle-password" class="absolute inset-y-0 end-0 pe-3 flex items-center text-emerald-600/70 hover:text-brand dark:text-emerald-400/70 transition-colors">
                          <i class="fas fa-eye text-xs"></i>
                      </button>
                  </div>
              </div>

              <div class="flex items-center gap-2 mt-1.5 mb-3">
                  <label class="flex items-center gap-2 cursor-pointer group mt-0.5">
                      <div class="relative flex items-center justify-center w-3.5 h-3.5 border-2 border-emerald-300 dark:border-emerald-700 rounded group-hover:border-brand transition-colors">
                          <input type="checkbox" required class="peer opacity-0 absolute inset-0 cursor-pointer w-full h-full">
                          <i class="fas fa-check text-[9px] text-brand opacity-0 peer-checked:opacity-100 transition-opacity"></i>
                      </div>
                      <span class="text-[11px] font-medium text-emerald-800/80 dark:text-emerald-300/80 select-none">I agree to the <a href="#" class="text-brand font-bold hover:underline">Terms & Privacy Policy</a></span>
                  </label>
              </div>

              <button type="submit" class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-2.5 px-4 rounded-xl shadow-lg shadow-brand/30 transition-all hover:-translate-y-0.5 text-xs mt-1">
                  Create Account
              </button>
          </form>

          <p class="text-center mt-5 text-xs font-medium text-emerald-800/80 dark:text-emerald-300/80">
              Already have an account? 
              <a href="login.html" class="text-brand font-bold hover:text-brand-dark hover:underline ms-1 transition-colors">Log in here</a>
          </p>
      </div>

      <!-- IMAGE SIDE -->
      <div class="hidden md:flex md:w-1/2 relative bg-brand p-8 text-white flex-col justify-end overflow-hidden">
          <div class="absolute inset-0">
              <img src="img/ayurveda (15).jpg" alt="Ayurvedic Healing & Herbs" class="w-full h-full object-cover opacity-50 mix-blend-overlay hover:scale-105 transition-transform duration-1000">
              <div class="absolute inset-0 bg-gradient-to-t from-emerald-950 via-emerald-950/40 to-transparent opacity-90"></div>
          </div>
          <div class="relative z-10 mt-auto">
              <div class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center text-white text-base mb-4 shadow-xl border border-white/30">
                <i class="fa-solid fa-seedling"></i>
              </div>
              <p class="text-lg font-bold leading-snug mb-4">"Embrace natural healing, ancient herbal traditions, and personalized care for lifelong wellness."</p>
              
              <div class="flex items-center gap-3">
                  <div class="flex -space-x-3">
                      <img class="w-8 h-8 rounded-full border-2 border-emerald-950 object-cover" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=200&q=80" alt="Patient Member">
                      <img class="w-8 h-8 rounded-full border-2 border-emerald-950 object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80" alt="Patient Member">
                      <img class="w-8 h-8 rounded-full border-2 border-emerald-950 object-cover" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80" alt="Patient Member">
                  </div>
                  <div class="text-[11px] text-emerald-200 font-medium">Trusted by 1,500+ Seekers of Health</div>
              </div>
          </div>
      </div>

  </div>

  <script>
      // Password toggle
      const toggleBtn = document.getElementById('toggle-password');
      const passInput = document.getElementById('password-input');
      
      if(toggleBtn && passInput) {
          toggleBtn.addEventListener('click', () => {
              if (passInput.type === 'password') {
                  passInput.type = 'text';
                  toggleBtn.innerHTML = '<i class="fas fa-eye-slash text-xs"></i>';
              } else {
                  passInput.type = 'password';
                  toggleBtn.innerHTML = '<i class="fas fa-eye text-xs"></i>';
              }
          });
      }

      // Theme logic
      const html = document.documentElement;
      const themeBtn = document.getElementById('darkToggleBtn');
      const savedTheme = localStorage.getItem('theme') || 'light';

      const setDarkMode = (isDark) => {
        if (isDark) {
          html.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          html.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
        if(themeBtn) themeBtn.textContent = isDark ? '☀️' : '🌙';
      };

      if (savedTheme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        setDarkMode(true);
      } else {
        setDarkMode(false);
      }

      if(themeBtn) {
        themeBtn.addEventListener('click', () => setDarkMode(!html.classList.contains('dark')));
      }
  
      // RTL Logic
      const rtlBtn = document.getElementById('rtlToggleBtn'); 
      const currentDir = localStorage.getItem('dir') || 'ltr';
      
      const setRTL = (isRTL) => {
        html.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
        localStorage.setItem('dir', isRTL ? 'rtl' : 'ltr');
        if(rtlBtn) rtlBtn.textContent = isRTL ? 'LTR' : 'RTL';
      };
      
      if (currentDir === 'rtl') setRTL(true);
      
      if (rtlBtn) {
          rtlBtn.addEventListener('click', () => setRTL(html.getAttribute('dir') !== 'rtl'));
      }
  </script>
</body>
</html>
